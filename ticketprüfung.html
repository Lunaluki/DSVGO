
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Luna – Ticketstatus prüfen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --blue-glow: #00d2ff;
            --blue-neon: #3b82f6;
            --blue-dark: #1d4ed8;
            --bg-dark: #070b14;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 210, 255, 0.08) 0%, transparent 45%);
            color: #f8fafc;
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--blue-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        main {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex: 1;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .edge-box {
            position: relative;
            border-radius: 20px;
            padding: 2px;
            background: transparent;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
        }

        .edge-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent 0deg,
                transparent 140deg,
                var(--blue-glow) 180deg,
                #ffffff 200deg,
                var(--blue-neon) 220deg,
                transparent 260deg
            );
            animation: rotateEdge 4s linear infinite;
        }

        @keyframes rotateEdge {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .edge-box-content {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.2rem;
            margin-top: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(9, 13, 22, 0.7);
            color: #f8fafc;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--blue-glow);
            outline: none;
            background: rgba(9, 13, 22, 0.9);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1.2rem;
            background: linear-gradient(135deg, var(--blue-neon), var(--blue-dark));
            color: white;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.5);
            filter: brightness(1.1);
        }

        .result {
            margin-top: 2rem;
            padding: 1.8rem;
            background: rgba(9, 13, 22, 0.8);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .result p {
            margin: 0.7rem 0;
            color: #cbd5e1;
            font-size: 0.98rem;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            margin: 20px auto;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--blue-glow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-open {
            color: #10b981;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .status-processing {
            color: #fbbf24;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.7);
            animation: pulseGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; filter: brightness(1); }
            100% { transform: scale(1.05); opacity: 1; filter: brightness(1.3); }
        }

        .status-closed {
            color: #ef4444;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }

        .hint {
            margin-top: 1.2rem;
            font-size: 0.88rem;
            color: #64748b;
            border-left: 3px solid var(--blue-glow);
            padding-left: 10px;
        }

        .back-btn {
            display: block;
            margin-top: 2rem;
            padding: 0.9rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: #64748b;
            font-size: 0.85rem;
            background: rgba(15, 23, 42, 0.4);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>Luna – Ticketstatus prüfen</h1>
</header>

<main>
    <div class="edge-box">
        <div class="edge-box-content">
            <h2>Ticketstatus abfragen</h2>
            <p>Gib deine Ticketnummer ein, um den aktuellen Bearbeitungsstand einzusehen:</p>

            <input type="text" id="ticketId" placeholder="z. B. LUNA-1722558123456">
            <button onclick="checkTicket()">⚡ Status abrufen</button>

            <div id="result"></div>

            <a class="back-btn" href="DSVGO2.html">← Zurück zur Informationsseite</a>
        </div>
    </div>
</main>

<footer>
    <p>Luna Support System &bull; Stand: September 2026</p>
</footer>

<script>
async function checkTicket() {
    const id = document.getElementById("ticketId").value.trim();
    const resultBox = document.getElementById("result");

    if (!id) {
        resultBox.innerHTML = `
            <div class="result" style="opacity:1; transform:translateY(0);">
                <p style="color:#ef4444;"><strong>Achtung:</strong> Bitte gib eine gültige Ticketnummer ein.</p>
            </div>
        `;
        return;
    }

    resultBox.innerHTML = `
        <div class="result" style="opacity:1; transform:translateY(0); text-align:center;">
            <div class="loading-spinner"></div>
            <p style="color:#94a3b8; margin-top:8px;">Frage Server ab...</p>
        </div>
    `;

    // Dynamische Backend-URL: Nutzt die Render-URL oder weicht auf localhost aus, falls du lokal testest
    const BACKEND_URL = window.location.hostname === 'localhost' 
        ? 'http://localhost:3000' 
        : 'https://meinserver-u317.onrender.com';

    const url = `${BACKEND_URL}/tickets/${encodeURIComponent(id)}`;

    try {
        const res = await fetch(url);
        
        if (!res.ok) {
            resultBox.innerHTML = `
                <div class="result" style="opacity:1; transform:translateY(0);">
                    <p style="color:#ef4444;"><strong>Kein Ticket gefunden</strong></p>
                    <p>Unter dieser Nummer konnte kein aktives Ticket im System ermittelt werden.</p>
                </div>
            `;
            return;
        }

        const data = await res.json();

        if (!data || !data.ticketId) {
            resultBox.innerHTML = `
                <div class="result" style="opacity:1; transform:translateY(0);">
                    <p style="color:#ef4444;"><strong>Kein Ticket gefunden</strong></p>
                    <p>Überprüfe bitte die Schreibweise deiner Ticketnummer.</p>
                </div>
            `;
            return;
        }

        let statusText = "";
        let statusClass = "";

        if (data.status === "open") {
            statusText = "🟢 Offen (Eingereicht)";
            statusClass = "status-open";
        } 
        else if (data.status === "processing") {
            statusText = "⚡ In Bearbeitung (Wird bearbeitet)";
            statusClass = "status-processing";
        } 
        else if (data.status === "closed") {
            statusText = "🔴 Abgeschlossen";
            statusClass = "status-closed";
        } else {
            statusText = `📌 ${data.status || 'Unbekannt'}`;
            statusClass = "status-processing";
        }

        resultBox.innerHTML = `
            <div class="result" style="opacity:1; transform:translateY(0);">
                <p><strong>Ticketnummer:</strong> <span style="color:var(--blue-glow); font-family:monospace; font-size:1.05rem;">${data.ticketId}</span></p>
                <p><strong>Aktueller Status:</strong> <span class="${statusClass}">${statusText}</span></p>
                <p><strong>Erstellt am:</strong> ${new Date(data.date || Date.now()).toLocaleString('de-DE')}</p>
                <p><strong>Betreff:</strong> ${data.subject || 'Luna Support Anfrage'}</p>
                <p><strong>Eingereicht von:</strong> ${data.from || 'Unbekannt'}</p>
                <p class="hint">
                    Durchschnittliche Bearbeitungszeit liegt bei ca. 24 Stunden.
                </p>
            </div>
        `;
    } catch (err) {
        resultBox.innerHTML = `
            <div class="result" style="opacity:1; transform:translateY(0);">
                <p style="color:#ef4444;"><strong>Verbindungsfehler</strong></p>
                <p>Der Server antwortet momentan nicht. Versuche es in wenigen Augenblicken erneut.</p>
            </div>
        `;
    }
}

document.getElementById("ticketId").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkTicket();
    }
});
</script>

</body>
</html>
