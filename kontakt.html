<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Luna Support – Kontakt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: "Inter", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #111827, #1f2937);
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid #30363d;
            animation: fadeIn 1s ease;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #f0f6fc;
            font-weight: 800;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 1s ease;
        }

        .contact-box {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 2rem;
            border-radius: 14px;
            box-shadow: 0 0 15px rgba(0,0,0,0.35);
            margin-top: 1.5rem;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
            color: #f0f6fc;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #111827;
            color: #c9d1d9;
            font-size: 1rem;
            transition: 0.25s;
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 8px rgba(59,130,246,0.4);
        }

        textarea {
            height: 180px;
            resize: none;
        }

        .send-btn {
            display: block;
            width: 100%;
            margin-top: 2rem;
            padding: 1.1rem;
            background: #3b82f6;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            text-align: center;
            transition: 0.25s;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .send-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 3rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #30363d;
            color: #9ca3af;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>Luna – Support Kontaktformular</h1>
</header>

<main>

    <div class="contact-box">
        <label for="email">Deine E‑Mail-Adresse</label>
        <input type="email" id="email" placeholder="z. B. name@gmail.com">

        <label for="phone">Deine Telefonnummer (optional)</label>
        <input type="text" id="phone" placeholder="z. B. +49 123 456789">

        <label for="message">Schilder uns dein Problem</label>
        <textarea id="message" placeholder="Beschreibe hier dein Anliegen..."></textarea>

        <button class="send-btn" onclick="openMail()">Senden</button>
    </div>

</main>

<footer>
    <p>Luna Support – Kontaktseite</p>
    <p>Stand: 31. Juli 2026</p>
</footer>

<script>
function openMail() {
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const message = document.getElementById("message").value;

    const mailtoLink =
        "mailto:luna.support.online.team@gmail.com"
        + "?subject=lunasupport"
        + "&body="
        + encodeURIComponent(
            "Email: " + email + "\n"
            + "Telefon: " + phone + "\n"
            + "Nachricht:\n" + message
        );

    window.location.href = mailtoLink;
}
</script>

</body>
</html>
