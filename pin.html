<!DOCTYPE html>
<html lang="de" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <title>AGA – PIN Verifizierung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- 🚫 Verbietet Google Chrome & Übersetzer-Tools jede Einmischung -->
    <meta name="google" content="notranslate">
    <meta name="googlebot" content="notranslate">
    
    <!-- 🛡️ CSP-Schutz mit deiner korrekten Backend-URL -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://meinserver-u317.onrender.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">

    <style>
        :root {
            --pink-main: #ff4fae;
            --pink-dark: #ff2f9c;
            --pink-light: #ff9dd6;
            --pink-neon: #ff00ff;
            --bg-dark: #0b020f;
            --box-bg: #16071c;
            --input-bg: rgba(255, 255, 255, 0.04);
        }

        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header { 
            background: linear-gradient(135deg, #ff2f9c 0%, #700035 100%); 
            padding: 2.5rem 2rem; 
            text-align: center; 
            border-bottom: 2px solid rgba(255, 157, 214, 0.3);
            box-shadow: 0 10px 30px rgba(255, 47, 156, 0.25);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--pink-neon), transparent);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        header p {
            margin-top: 0.4rem;
            font-size: 1rem;
            color: #ffe6f5;
            font-weight: 300;
        }

        main { 
            max-width: 420px; 
            width: 100%;
            margin: auto; 
            padding: 2rem 1rem; 
            box-sizing: border-box;
        }

        .box { 
            background: var(--box-bg); 
            border: 1px solid rgba(255, 157, 214, 0.2); 
            border-radius: 20px; 
            padding: 2.2rem; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: white;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.88rem;
            color: #d1b3cb;
            margin-bottom: 1.8rem;
            line-height: 1.4;
        }

        .form-group { 
            margin-bottom: 1.2rem; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--pink-light); 
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input { 
            width: 100%; 
            padding: 0.9rem 1rem; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 157, 214, 0.25); 
            background: var(--input-bg); 
            color: white; 
            font-size: 1rem;
            box-sizing: border-box; 
            transition: all 0.25s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--pink-neon);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.25);
        }

        #pinInput {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 8px;
            font-weight: bold;
            font-family: monospace;
        }

        .btn-action { 
            width: 100%; 
            padding: 0.95rem; 
            background: linear-gradient(135deg, var(--pink-main), var(--pink-dark)); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem;
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 47, 156, 0.4);
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }

        .btn-action:hover {
            box-shadow: 0 0 25px var(--pink-neon);
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .switch-link { 
            text-align: center; 
            margin-top: 1.8rem; 
        }

        .switch-link a { 
            color: var(--pink-light); 
            text-decoration: none; 
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .switch-link a:hover { 
            color: white;
            text-decoration: underline; 
        }

        footer {
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(255, 157, 214, 0.1);
            color: #a88fa2;
            font-size: 0.85rem;
        }

        .fade-in {
            animation: fadeIn 0.35s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>Luna Support</h1>
    <p>Sicherheits-PIN Verifizierung</p>
</header>

<main>
    <div class="box">
        <h2>Code eingeben</h2>
        <p class="subtitle">Wir haben dir einen 6-stelligen PIN an deine E-Mail-Adresse geschickt.</p>
        
        <!-- Direkte PIN-Eingabe, da die Mail im vorherigen Schritt bereits angefordert wurde -->
        <form id="verifyPinForm" class="fade-in" onsubmit="verifyPin(event)">
            <div class="form-group">
                <label for="pinInput">6-Stelliger Code</label>
                <input type="text" id="pinInput" placeholder="------" maxlength="6" inputmode="numeric" required autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn-action">PIN bestätigen</button>
        </form>

        <div class="switch-link">
            <a href="login.html">← Zurück zum Login</a>
        </div>
    </div>
</main>

<footer>
    <p>☆『Luna Team』☆ – Schutzsystem für die AGA Community</p>
</footer>

<script>
    const API_BASE = "https://meinserver-u317.onrender.com";

    // Die E-Mail wurde beim Klick auf "Passwort vergessen?" im localStorage gespeichert
    const storedIdentifier = localStorage.getItem("luna_reset_email") || "";

    async function verifyPin(event) {
        event.preventDefault();
        const pinValue = document.getElementById("pinInput").value.trim();
        
        if (!pinValue) return;

        if (!storedIdentifier) {
            alert("⚠️ Keine E-Mail-Adresse gefunden. Bitte fordere den PIN erneut an.");
            window.location.href = "login.html";
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/api/auth/verify-pin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: storedIdentifier, pin: pinValue })
            });

            const text = await res.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch (e) {}

            if (res.ok || data.success) {
                // Berechtigungs-Flag für die Passwort-Änderungsseite setzen
                sessionStorage.setItem("pin_verified", "true");
                sessionStorage.setItem("reset_email", storedIdentifier);

                alert("✅ PIN erfolgreich bestätigt!");
                window.location.href = "passwortvergessen.html"; // Oder deine Zielseite zum Ändern des Passworts
            } else {
                alert("⚠️ " + (data.error || text || "Ungültiger oder abgelaufener PIN!"));
            }
        } catch (err) {
            console.error(err);
            alert("❌ Verbindungsfehler zum Server.");
        }
    }
</script>

</body>
</html>
