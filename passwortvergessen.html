<!DOCTYPE html>
<html lang="de" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <title>AGA – Passwort zurücksetzen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- 🚫 Verbietet Google Chrome & Übersetzer-Tools jede Einmischung -->
    <meta name="google" content="notranslate">
    <meta name="googlebot" content="notranslate">
    
    <!-- 🛡️ CSP-Schutz -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://dsvgo.onrender.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">

    <style>
        :root {
            --pink-main: #ff4fae;
            --pink-dark: #ff2f9c;
            --pink-light: #ff9dd6;
            --pink-neon: #ff00ff;
        }
        body { 
            background: #110515; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background: linear-gradient(135deg, #ff2f9c, #aa0055); 
            padding: 3rem 2rem; 
            text-align: center; 
            border-bottom: 2px solid var(--pink-light);
            box-shadow: 0 0 30px rgba(255, 47, 156, 0.4);
        }
        header h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
        }
        header p {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #ffe6f5;
        }
        main { 
            max-width: 450px; 
            margin: 3rem auto; 
            padding: 0 1rem; 
        }
        .box { 
            background: #1e0924; 
            border: 2px solid rgba(255, 157, 214, 0.3); 
            border-radius: 14px; 
            padding: 2rem; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: white;
            border-left: 4px solid var(--pink-light);
            padding-left: 0.7rem;
            margin-bottom: 1.5rem;
        }
        .form-group { 
            margin-bottom: 1.2rem; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 0.4rem; 
            color: var(--pink-light); 
            font-weight: bold; 
        }
        .form-group input { 
            width: 100%; 
            padding: 0.8rem; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 157, 214, 0.4); 
            background: rgba(255,255,255,0.05); 
            color: white; 
            font-size: 1rem;
            box-sizing: border-box; 
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--pink-neon);
            box-shadow: 0 0 10px var(--pink-neon);
        }
        .btn-action { 
            width: 100%; 
            padding: 0.9rem; 
            background: linear-gradient(135deg, var(--pink-main), var(--pink-dark)); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .btn-action:hover {
            box-shadow: 0 0 25px var(--pink-neon);
            transform: translateY(-2px);
        }
        .switch-link { 
            text-align: center; 
            margin-top: 1.5rem; 
        }
        .switch-link a { 
            color: var(--pink-light); 
            text-decoration: none; 
            font-weight: bold; 
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--pink-dark);
            color: #ffe6f5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Luna Support</h1>
    <p>Passwort wiederherstellen</p>
</header>

<main>
    <div class="box">
        <h2 id="formTitle">Passwort anfordern</h2>
        
        <!-- Ansicht 1: E-Mail eingeben, um Link zu erhalten -->
        <form id="requestForm" onsubmit="requestPasswordReset(event)">
            <div class="form-group">
                <label for="email">Benutzername oder E-Mail:</label>
                <input type="text" id="email" placeholder="Dein Benutzername oder E-Mail" required>
            </div>
            <button type="submit" class="btn-action">Reset-Link senden</button>
        </form>

        <!-- Ansicht 2: Neues Passwort vergeben (wird nur angezeigt, wenn Token im Pfad) -->
        <form id="resetForm" onsubmit="submitNewPassword(event)" style="display: none;">
            <div class="form-group">
                <label for="newPassword">Neues Passwort:</label>
                <input type="password" id="newPassword" placeholder="Gib dein neues Passwort ein" required>
            </div>
            <button type="submit" class="btn-action">Passwort speichern</button>
        </form>

        <div class="switch-link">
            <a href="/admin">← Zurück zum Admin / Login</a>
        </div>
    </div>
</main>

<footer>
    <p>☆『Luna Team』☆ – Schutzsystem für die AGA Community</p>
</footer>

<script>
    const API_BASE = "https://dsvgo.onrender.com";

    // 🔍 Token aus dem URL-Pfad auslesen: /passwortvergessen.html/DEIN_TOKEN
    const pathParts = window.location.pathname.split("/");
    // Suchen nach dem Part nach "passwortvergessen.html"
    const tokenIndex = pathParts.indexOf("passwortvergessen.html");
    let token = null;
    
    if (tokenIndex !== -1 && pathParts[tokenIndex + 1]) {
        token = pathParts[tokenIndex + 1];
    }

    if (token) {
        document.getElementById("formTitle").innerText = "Neues Passwort vergeben";
        document.getElementById("requestForm").style.display = "none";
        document.getElementById("resetForm").style.display = "block";
    }

    // 1️⃣ Schritt 1: Link anfordern
    async function requestPasswordReset(event) {
        event.preventDefault();
        
        const emailInput = document.getElementById("email").value.trim();
        if (!emailInput) return;

        try {
            const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput })
            });

            const data = await res.json();

            if (res.ok) {
                alert("📩 Falls das Konto existiert, wurde dir ein Reset-Link per E-Mail geschickt!");
                window.location.href = "/";
            } else {
                alert("⚠️ " + (data.error || "Fehler beim Anfordern des Links."));
            }
        } catch (err) {
            console.error(err);
            alert("❌ Verbindungsfehler zum Server.");
        }
    }

    // 2️⃣ Schritt 2: Tatsächlich das neue Passwort abschicken (mit Token)
    async function submitNewPassword(event) {
        event.preventDefault();

        const passwordInput = document.getElementById("newPassword").value;
        if (!passwordInput || !token) return;

        try {
            const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, password: passwordInput })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                alert("🔒 Dein Passwort wurde erfolgreich geändert! Du kannst dich jetzt einloggen.");
                window.location.href = "/admin";
            } else {
                alert("⚠️ " + (data.error || "Der Link ist ungültig oder abgelaufen."));
            }
        } catch (err) {
            console.error(err);
            alert("❌ Verbindungsfehler zum Server.");
        }
    }
</script>

</body>
</html>
