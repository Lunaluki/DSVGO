<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09111f">
    <title>Luna Support – Browser-Call</title>
    <style>
        :root {
            --bg: #07101d;
            --panel: rgba(13, 27, 46, .82);
            --line: rgba(151, 190, 230, .18);
            --text: #f1f7ff;
            --muted: #91a8c2;
            --cyan: #5de2ff;
            --mint: #62f0b1;
            --gold: #ffd166;
            --red: #ff7187;
            --shadow: 0 24px 70px rgba(0, 0, 0, .3);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif; display: flex; flex-direction: column; justify-content: space-between;
        }
        body::before, body::after {
            content: ""; position: fixed; z-index: -1; width: 42vw; height: 42vw; border-radius: 50%; filter: blur(70px); opacity: .18; pointer-events: none;
        }
        body::before { top: -18vw; left: -12vw; background: var(--cyan); }
        body::after { right: -16vw; bottom: -18vw; background: #ff789d; }

        .shell { width: min(850px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 54px; flex: 1; }
        header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
        .eyebrow { color: var(--cyan); font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
        h1 { margin: 8px 0 6px; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 3.5rem); line-height: .96; }
        .subtitle { margin: 0; color: var(--muted); }
        .pill, .back-link { border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; color: var(--muted); text-decoration: none; background: rgba(8, 20, 35, .65); font-size: .86rem; }
        .back-link { color: var(--text); transition: transform .2s ease, border-color .2s ease; }
        .back-link:hover { transform: translateY(-2px); border-color: var(--cyan); }
        .dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--mint); }
        .card { border: 1px solid var(--line); background: linear-gradient(145deg, var(--panel), rgba(7, 17, 31, .76)); box-shadow: var(--shadow); border-radius: 22px; padding: 32px; text-align: center; }
        .call-icon { display: inline-grid; place-items: center; width: 80px; height: 80px; border-radius: 50%; color: var(--cyan); border: 1px solid currentColor; margin-bottom: 20px; }
        .call-icon.active { color: var(--mint); box-shadow: 0 0 40px rgba(98, 240, 177, .4); }
        .call-icon svg { width: 36px; height: 36px; fill: currentColor; }
        .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 999px; font-weight: 700; font-size: .95rem; cursor: pointer; border: none; transition: transform .2s ease; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--mint)); color: #07101d; }
        .btn-danger { background: linear-gradient(135deg, var(--red), var(--gold)); color: #07101d; display: none; }
        .status-box { margin-top: 20px; padding: 14px; background: rgba(8, 20, 35, .6); border-radius: 12px; font-size: .9rem; color: var(--muted); border: 1px solid var(--line); }
        .footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 40px; }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <div>
                <div class="eyebrow">Luna Live / WebRTC</div>
                <h1>Browser-Call</h1>
                <p class="subtitle">Direktes Sprachgespräch mit dem Support.</p>
            </div>
            <div>
                <span class="pill"><span class="dot"></span>Online</span>
                <a class="back-link" href="DSVGO3.html">&larr; Zurück</a>
            </div>
        </header>

        <section class="card">
            <div id="call-orb" class="call-icon">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
            </div>
            <h2 id="call-title">Bereit für den Anruf</h2>
            <p id="call-desc">Klicke auf "Anruf starten", um die Verbindung aufzubauen.</p>
            
            <div>
                <button id="start-call-btn" class="btn btn-primary" onclick="startCall()">Anruf Starten</button>
                <button id="end-call-btn" class="btn btn-danger" onclick="endCall()">Auflegen</button>
            </div>

            <div id="status-msg" class="status-box">Status: Bereit</div>
            <audio id="remote-audio" autoplay></audio>
        </section>
        <div class="footer">Luna Support &bull; Live System</div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let globalAudioStream = null;
        let peerConnection = null;
        const userId = "Anrufer_" + Math.floor(Math.random() * 10000);

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        async function startCall() {
            const statusMsg = document.getElementById('status-msg');
            const callOrb = document.getElementById('call-orb');
            
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                statusMsg.innerHTML = "❌ <strong>Fehler:</strong> Mikrofon erfordert HTTPS!";
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusMsg.textContent = "❌ Fehler: Dein Browser unterstützt kein getUserMedia.";
                return;
            }

            try {
                statusMsg.textContent = "Fordere Mikrofon-Zugriff an...";
                
                const mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                
                globalAudioStream = mediaStream;

                callOrb.classList.add('active');
                document.getElementById('start-call-btn').style.display = 'none';
                document.getElementById('end-call-btn').style.display = 'inline-flex';
                document.getElementById('call-title').textContent = "Warteschlange / Verbindet...";
                statusMsg.textContent = "Mikrofon aktiv. Verbinde...";

                socket.emit('request-call', { adminId: "Owner", targetUserId: userId });

            } catch (error) {
                console.error("Mikrofon-Fehler:", error);
                statusMsg.textContent = "❌ Mikrofon-Fehler: " + (error.message || error.name);
            }
        }

        socket.on('queue-status', (data) => {
            const statusMsg = document.getElementById('status-msg');
            document.getElementById('call-title').textContent = "Leitung belegt (Warteschlange)";
            statusMsg.textContent = data.message; 
        });

        socket.on('call-connected', async (data) => {
            const statusMsg = document.getElementById('status-msg');
            document.getElementById('call-title').textContent = "Gespräch aktiv";
            statusMsg.textContent = "Verbindung steht.";

            try {
                peerConnection = new RTCPeerConnection(rtcConfig);
                if (globalAudioStream) {
                    globalAudioStream.getTracks().forEach(track => peerConnection.addTrack(track, globalAudioStream));
                }

                peerConnection.ontrack = event => {
                    document.getElementById('remote-audio').srcObject = event.streams[0];
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        socket.emit('ice-candidate', { candidate: event.candidate, to: data.adminSocketId });
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-offer', { offer: offer, target: data.adminSocketId });
            } catch (err) {
                console.error("WebRTC Fehler:", err);
                statusMsg.textContent = "Fehler beim Aufbau der Sprachverbindung.";
            }
        });

        socket.on('webrtc-offer', async (data) => {
            if (!peerConnection) {
                peerConnection = new RTCPeerConnection(rtcConfig);
                if (globalAudioStream) {
                    globalAudioStream.getTracks().forEach(track => peerConnection.addTrack(track, globalAudioStream));
                }
                peerConnection.ontrack = event => {
                    document.getElementById('remote-audio').srcObject = event.streams[0];
                };
                peerConnection.onicecandidate = event => {
                    if (event.candidate) socket.emit('ice-candidate', { candidate: event.candidate, to: data.from });
                };
            }
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('webrtc-answer', { answer: answer, target: data.from });
        });

        socket.on('webrtc-answer', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection && data.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function endCall() {
            if (globalAudioStream) {
                globalAudioStream.getTracks().forEach(track => track.stop());
                globalAudioStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            socket.emit('end-call');

            document.getElementById('call-orb').classList.remove('active');
            document.getElementById('start-call-btn').style.display = 'inline-flex';
            document.getElementById('end-call-btn').style.display = 'none';
            document.getElementById('call-title').textContent = "Bereit für den Anruf";
            document.getElementById('status-msg').textContent = "Anruf beendet.";
        }
    </script>
</body>
</html>
