<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AGA – Luna Registrierung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --pink-main: #ff4fae;
            --pink-dark: #ff2f9c;
            --pink-light: #ff9dd6;
            --pink-neon: #ff00ff;
        }

        body {
            background: #110515;
            color: white;
            font-family: "Inter", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        header {
            background: linear-gradient(135deg, #ff2f9c, #aa0055);
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 2px solid var(--pink-light);
            box-shadow: 0 0 30px rgba(255, 47, 156, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
        }

        header p {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #ffe6f5;
        }

        main {
            max-width: 450px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .box {
            background: #1e0924;
            border: 2px solid rgba(255, 157, 214, 0.3);
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: white;
            border-left: 4px solid var(--pink-light);
            padding-left: 0.7rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: var(--pink-light);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 157, 214, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--pink-neon);
            box-shadow: 0 0 10px var(--pink-neon);
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--pink-main), var(--pink-dark));
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .btn-action:hover {
            box-shadow: 0 0 25px var(--pink-neon);
            transform: translateY(-2px);
        }

        .switch-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #ffe6f5;
        }

        .switch-link a {
            color: var(--pink-light);
            text-decoration: none;
            font-weight: bold;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--pink-dark);
            color: #ffe6f5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Luna Blacklist</h1>
    <p>Registriere dich, um Nummern im System zu melden.</p>
</header>

<main>
    <div class="box">
        <h2>Account erstellen</h2>
        <form id="registerForm" onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="regUsername">Benutzername:</label>
                <input type="text" id="regUsername" placeholder="Dein Benutzername" required>
            </div>
            
            <div class="form-group">
                <label for="regPassword">Passwort:</label>
                <input type="password" id="regPassword" placeholder="Dein Passwort" required>
            </div>

            <button type="submit" class="btn-action">Registrieren</button>
        </form>

        <div class="switch-link">
            Bereits registriert? <a href="login.html">Hier einloggen</a>
        </div>
    </div>
</main>

<footer>
    <p>☆『Luna Team』☆ – Schutzsystem für die AGA Community</p>
</footer>

<script>
    // Automatische URL-Erkennung (greift lokal sowie auf Render)
    const API_BASE = window.location.origin.includes("onrender.com") 
        ? window.location.origin 
        : "https://dsvgo.onrender.com"; // Passe das bei Bedarf an deine Render-URL an

    async function registerUser(event) {
        event.preventDefault();
        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value.trim();

        try {
            const res = await fetch(`${API_BASE}/api/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem("luna_user_token", data.token);
                localStorage.setItem("luna_username", data.username);
                alert("🎉 Erfolgreich registriert!");
                window.location.href = "blacklist.html";
            } else {
                alert("⚠️ " + (data.error || "Registrierung fehlgeschlagen."));
            }
        } catch (err) {
            console.error(err);
            alert("❌ Verbindungsfehler zum Server.");
        }
    }
</script>

</body>
</html>
