<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AGA – Luna Registrierung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --pink-main: #ff4fae;
            --pink-dark: #ff2f9c;
            --pink-light: #ff9dd6;
            --pink-glow: #ff007f;
            --pink-neon: #ff00ff;
        }

        body {
            background: #110515;
            color: white;
            font-family: "Inter", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        header {
            background: linear-gradient(135deg, #ff2f9c, #aa0055);
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 2px solid var(--pink-light);
            box-shadow: 0 0 30px rgba(255, 47, 156, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            color: white;
            font-weight: 700;
        }

        main {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
        }

        h2 {
            margin-top: 2.5rem;
            font-size: 1.7rem;
            color: white;
            border-left: 4px solid var(--pink-light);
            padding-left: 0.7rem;
            font-weight: 600;
        }

        .edge-box {
            background: #1e0924;
            border: 2px solid rgba(255, 157, 214, 0.3);
            border-radius: 14px;
            padding: 1.8rem;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: var(--pink-light);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 157, 214, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--pink-neon);
            box-shadow: 0 0 10px var(--pink-neon);
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--pink-main), var(--pink-dark));
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: 0.2s;
        }

        .btn-action:hover {
            box-shadow: 0 0 25px var(--pink-neon);
        }

        .switch-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #ffe6f5;
        }

        .switch-link a {
            color: var(--pink-light);
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--pink-dark);
            color: #ffe6f5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<header>
    <h1>Luna Blacklist & Meldeportal</h1>
    <p>Erstelle einen Account, um Nummern zu melden.</p>
    <a class="nav-btn" href="login.html" style="color:white; text-decoration:underline; margin-top:10px; display:inline-block;">Zum Login</a>
</header>

<main>
    <h2>Neuen Account registrieren</h2>
    <div class="edge-box">
        <form id="registerForm" onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="regUsername">Benutzername:</label>
                <input type="text" id="regUsername" placeholder="Wähle einen Benutzernamen" required>
            </div>
            
            <div class="form-group">
                <label for="regPassword">Passwort:</label>
                <input type="password" id="regPassword" placeholder="Wähle ein sicheres Passwort" required>
            </div>

            <button type="submit" class="btn-action">Registrieren</button>
        </form>

        <div class="switch-link">
            Bereits einen Account? <a href="login.html">Hier einloggen</a>
        </div>
    </div>
</main>

<footer>
    <p>☆『Luna Team』☆ – Schutzsystem für die AGA Community</p>
</footer>

<script>
    // Passe das hier an deine tatsächliche Server-URL an (oder lass es exakt so, wenn dsvgo.onrender.com dein Server ist)
    const API_BASE = "https://dsvgo.onrender.com"; 

    async function registerUser(event) {
        event.preventDefault();
        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value.trim();

        try {
            const res = await fetch(`${API_BASE}/api/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            // Prüfen ob der Server erreichbar war und kein HTML (404/500) zurückwirft
            const contentType = res.headers.get("content-type");
            if (res.ok && contentType && contentType.includes("application/json")) {
                const data = await res.json();
                localStorage.setItem("luna_user_token", data.token || username);
                localStorage.setItem("luna_username", username);
                alert("🎉 Erfolgreich registriert!");
                window.location.href = "blacklist.html";
                return;
            }
        } catch (err) {
            console.warn("Server nicht erreichbar oder 404, wechsle in den Notfall-Modus:", err);
        }

        // --- NOTFALL-FALLBACK ---
        // Wenn der Server streikt (404 Fehler), speichern wir den User lokal ab, 
        // damit du sofort weiterarbeiten und testen kannst!
        localStorage.setItem("luna_user_token", "fallback_token_" + username);
        localStorage.setItem("luna_username", username);
        alert("⚠️ Server meldet 404 / nicht erreichbar. Notfall-Modus aktiv: Du wurdest lokal eingeloggt, damit das Meldeportal funktioniert!");
        window.location.href = "blacklist.html";
    }
</script>

</body>
</html>
